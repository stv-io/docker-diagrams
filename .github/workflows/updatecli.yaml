name: updatecli
on:
  workflow_dispatch:
  schedule:
    - cron: "43 9 * * FRI"

permissions:
  contents: write
  pull-requests: write
jobs:
  updatecli:
    runs-on: ubuntu-latest
    env:
      GITHUB_USERNAME: "updatecli-bot"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@v3.8.0
      - name: Run Updatecli in Dry Run mode
        run: updatecli diff --config updatecli.yaml
        env:
          # PAT: GITHUB_TOKEN cannot push workflow-file changes, and PRs it opens do not trigger CI
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      - name: Run Updatecli in Apply mode
        run: updatecli apply --config updatecli.yaml
        env:
          # PAT: GITHUB_TOKEN cannot push workflow-file changes, and PRs it opens do not trigger CI
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
