name: Build and publish docker images
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  packages: write
  contents: read

env:
  # Commit-specific tag, so the test job pulls exactly the image built in this run
  COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Extract version
        id: get_version
        run: echo "version=$(tr -d '[:space:]' < version.txt)" >> $GITHUB_OUTPUT
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            ghcr.io/stv-io/docker-diagrams
          tags: |
            type=raw,value=${{ env.COMMIT_SHA }}
            # Release tag is only published from master, not from PRs
            type=raw,value=v${{ steps.get_version.outputs.version }},enable={{is_default_branch}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DIAGRAMS_VERSION=${{ steps.get_version.outputs.version }}

  test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/stv-io/docker-diagrams:${{ github.event.pull_request.head.sha || github.sha }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: generate diagrams
        run: |
          python3 -c 'import diagrams, importlib.metadata as m; print("diagrams", m.version("diagrams"))'
          python3 example.py
          test -s flow.png
          ls -ltrh flow.png
